allowBuilds:
  sharp: true

# NOTE (pnpm >= 11): install settings live here, NOT in package.json#pnpm
# (that field is silently ignored). See https://pnpm.io/settings
#
# shadcn 4.21.0 + MCP SDK 1.30.0 need a MIXED zod tree (verified 2026-09-10):
# - root zod stays v3: shadcn's bundled schemas call .deepPartial(),
#   removed in zod v4.
# - the SDK subtree gets v4: SDK 1.30 unconditionally imports
#   zod/v3 + zod/v4-mini, which only exist inside the zod v4 package.
overrides:
  "@modelcontextprotocol/sdk>zod": ^4
  "zod-to-json-schema>zod": ^4
  "@modelcontextprotocol/sdk": 1.30.0
