name: CI

on:
  push:
    paths:
      - "**.c"
      - "**.h"
      - "**/Makefile"
      - "**/Forge.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.c"
      - "**.h"
      - "**/Makefile"
      - "**/Forge.toml"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows gcc)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: make CC=gcc

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: make CC=${{ matrix.compiler }}

      - name: Run `make test`
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: make test CC=gcc

      - name: Run `make test` (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: make test CC=${{ matrix.compiler }}

      - name: Self-hosting end-to-end test (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: build/forge.exe run --release

      - name: Self-hosting end-to-end test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: build/forge run --release

      # The test/ fixture is the canonical acceptance test (see AGENTS.md):
      # build it, then assert the immediate rerun recompiles nothing.
      - name: Fixture end-to-end test (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: build/forge.exe run --release --manifest test/Forge.toml

      - name: Fixture end-to-end test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: build/forge run --release --manifest test/Forge.toml

      - name: Fixture incremental rerun (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          build/forge.exe run --release --manifest test/Forge.toml >/dev/null 2>&1
          build/forge.exe run --release --manifest test/Forge.toml >/dev/null 2>&1
          log="$(ls -t test/target/logs/build-*.log | head -n 1)"
          echo "rerun log: $log"
          test "$(grep -c '\[compile\] source:' "$log")" = "0"

      - name: Fixture incremental rerun (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          build/forge run --release --manifest test/Forge.toml >/dev/null 2>&1
          build/forge run --release --manifest test/Forge.toml >/dev/null 2>&1
          log="$(ls -t test/target/logs/build-*.log | head -n 1)"
          echo "rerun log: $log"
          test "$(grep -c '\[compile\] source:' "$log")" = "0"

      # Dependency and engine regression suites (sandboxed, self-contained).
      - name: Dependency + engine regressions (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: make regression CC=gcc

      - name: Dependency + engine regressions (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: make regression CC=${{ matrix.compiler }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/forge*
          retention-days: 1
          if-no-files-found: warn